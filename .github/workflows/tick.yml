name: Scheduled tick

# The real cadence for background work.
#
# Vercel's Hobby plan allows two cron jobs, daily only — enough to deploy, not
# enough to publish a post at the minute someone scheduled it. This workflow is
# the plan-independent scheduler: it calls the same endpoint `vercel.json`
# points at, just far more often.
#
# GitHub's minimum interval is five minutes and firing is best-effort, so a run
# can be late or skipped under load. That is survivable by design — every step
# behind /api/cron/tick is idempotent and the due-post window looks an hour
# backwards, so a missed run is caught by the next one rather than lost.
#
# Requires two repository secrets. Without them the job exits cleanly rather
# than failing, so a fork or a fresh clone doesn't show a red X for a thing it
# was never configured to do:
#   APP_URL      — e.g. https://your-project.vercel.app
#   CRON_SECRET  — the same value set in the Vercel project's env vars

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# A slow tick must never overlap the next one: two drains claiming at once is
# handled by the queue's leases, but there is no reason to spend the requests.
concurrency:
  group: scheduled-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the tick endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set — nothing to call."
            echo "Set both under Settings → Secrets and variables → Actions."
            exit 0
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/tick")

          echo "HTTP $status"
          cat response.json
          echo

          # 401 means the secret doesn't match what the app expects, which is a
          # configuration error worth failing loudly for — it would otherwise
          # look like a working schedule that quietly does nothing.
          if [ "$status" = "401" ]; then
            echo "::error::CRON_SECRET does not match the value set in Vercel."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Tick returned $status"
            exit 1
          fi
